name: Test user Input Workflow

# controls when the action will run, workflow runs when manually triggered using the UI or API

on: 
 workflow_dispatch

 # inputs the workflow accecpt.

inputs:
  number1:
      # friendly description to be shown in the UI instead of number1
    description: 'First number'
   # Default value if no value is explictly provided
   	default: '0'
    required: true

     #input has to be provided for the workflow to run. 
  number2:
    description: 'second number'
    defaults: '0'
    required: true 


jobs:
  add_numbers:
   runs-on: ubuntu-latest

   steps:
     - name: add numbers
       id: sum
       run: echo "::set-output name=sum::$((${{ inputs.number1 }} + ${{ inputs.number2 }} ))"
     - name: add numbers
       run: echo "The sum of ${{ inputs.number1 }} and ${{inputs.number2 }} is ${{ steps.sum.output.sum }}"
